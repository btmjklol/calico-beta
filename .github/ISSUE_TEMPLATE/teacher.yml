name: List me as a teacher
description: Teach music? Ask to be listed in Calico's "Find a teacher". Free, checked by hand.
title: "Teacher: "
labels: ["teacher"]
body:
  - type: markdown
    attributes:
      value: |
        Calico points learners toward real teachers, because there's a side of music an app can't teach.
        Listing is free. Everything you write here is public, so only share what you want people to see.
        Each entry is checked by hand before it appears in the app.
        Listed teachers get Calico Pro free. We'll reply here to arrange your key privately.
  - type: input
    id: name
    attributes:
      label: Your name, or your studio's
    validations:
      required: true
  - type: input
    id: instruments
    attributes:
      label: What you teach
      description: Instruments or voice, separated by commas.
      placeholder: guitar, bass, ukulele
    validations:
      required: true
  - type: input
    id: town
    attributes:
      label: Town or city
  - type: input
    id: state
    attributes:
      label: State, province or country
  - type: dropdown
    id: online
    attributes:
      label: Do you teach online?
      options:
        - "Yes"
        - "No, in person only"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Where people can reach you
      description: Your own website or public page. Please don't post a personal phone number or home address here.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: blurb
    attributes:
      label: A line or two about your teaching
      description: Shown under your name. Keep it short.
  - type: checkboxes
    id: ok
    attributes:
      label: OK to list
      options:
        - label: I'm the teacher (or run the studio), and I'm happy for this to appear in Calico.
          required: true
